<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Premium Dark Rounded Background -->
  <rect width="512" height="512" rx="112" fill="#0A0A0A" stroke="#1A1A1A" stroke-width="4"/>
  
  <!-- Scale & Centered Brand Group -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Africa Outline in vibrant green -->
    <path
      d="M 38,15 
         C 48,13 62,11 72,18 
         C 76,21 75,27 79,31 
         C 82,34 86,36 86,41 
         C 86,47 80,51 77,55 
         C 73,60 70,66 65,72 
         C 60,78 57,85 52,91 
         C 51,93 49,93 48,91 
         C 45,84 44,77 42,71 
         C 40,66 38,62 33,59 
         C 28,56 22,55 18,50 
         C 13,44 11,36 15,29 
         C 18,22 27,17 38,15 Z"
      stroke="#08BF5A"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    
    <!-- Stylized Golden Shopping Cart overlapping the continent -->
    <!-- Handle -->
    <path
      d="M 33,40 L 39,46 L 68,46"
      stroke="#D4AF37"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <!-- Basket -->
    <path
      d="M 39,46 L 43,62 L 63,62 L 68,46 Z"
      fill="rgba(212, 175, 55, 0.08)"
      stroke="#D4AF37"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Basket grid lines -->
    <path
      d="M 48,46 L 49,62 M 57,46 L 56,62 M 39,54 L 66,54"
      stroke="#D4AF37"
      stroke-width="2"
      stroke-linecap="round"
      opacity="0.7"
      fill="none"
    />
    <!-- Wheel joints -->
    <path
      d="M 45,62 L 43,69 M 61,62 L 59,69"
      stroke="#D4AF37"
      stroke-width="3.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Wheels -->
    <circle cx="43" cy="74" r="4.5" fill="#D4AF37" />
    <circle cx="59" cy="74" r="4.5" fill="#D4AF37" />
    <!-- Wheel center hubs -->
    <circle cx="43" cy="74" r="1.5" fill="#000" />
    <circle cx="59" cy="74" r="1.5" fill="#000" />
  </g>
</svg>
